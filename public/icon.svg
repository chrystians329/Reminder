<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Subtle smooth gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle border outline -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.12"/>

  <!-- Main Round Clock Face (Centered slightly down-left to balance top-right task badge) -->
  <g transform="translate(236, 276)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#ffffff" stroke-width="20"/>
    
    <!-- Clock Center Dot -->
    <circle cx="0" cy="0" r="10" fill="#ffffff"/>
    
    <!-- Hour Hand (pointing at 10) -->
    <line x1="0" y1="0" x2="-55" y2="-75" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Minute Hand (pointing at 2) -->
    <line x1="0" y1="0" x2="80" y2="-45" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

    <!-- Subtle Clock Ticks (12, 3, 6, 9) -->
    <line x1="0" y1="-144" x2="0" y2="-128" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <line x1="144" y1="0" x2="128" y2="0" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <line x1="0" y1="144" x2="0" y2="128" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <line x1="-144" y1="0" x2="-128" y2="0" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Top-Right Task Badge / Checklist Card -->
  <g transform="translate(320, 72)" filter="url(#badgeShadow)">
    <!-- Task Card Base -->
    <rect x="0" y="0" width="136" height="152" rx="28" fill="#ffffff"/>
    
    <!-- Clipboard Top Clip -->
    <rect x="40" y="-10" width="56" height="18" rx="8" fill="#000000"/>

    <!-- Task Item 1 with Checkmark -->
    <g transform="translate(20, 36)">
      <circle cx="16" cy="16" r="13" fill="#000000"/>
      <!-- Checkmark -->
      <polyline points="10,16 15,21 23,11" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Task line -->
      <line x1="38" y1="16" x2="88" y2="16" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Task Item 2 with Checkbox -->
    <g transform="translate(20, 76)">
      <circle cx="16" cy="16" r="13" fill="#000000"/>
      <!-- Checkmark -->
      <polyline points="10,16 15,21 23,11" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Task line -->
      <line x1="38" y1="16" x2="82" y2="16" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Task Item 3 Line -->
    <g transform="translate(20, 116)">
      <circle cx="16" cy="16" r="13" fill="none" stroke="#000000" stroke-width="3.5"/>
      <!-- Task line -->
      <line x1="38" y1="16" x2="74" y2="16" stroke="#888888" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
